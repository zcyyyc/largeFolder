name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: '& .\build.ps1'
      - name: Storage integration tests
        run: '& .\tests\run-tests.ps1'
      - name: Ordering tests
        run: '& .\tests\run-ordering-tests.ps1'
      - name: Geometry and persistence tests
        run: '& .\tests\run-geometry-tests.ps1'
      - name: Package portable application
        run: '& .\package.ps1'
      - uses: actions/upload-artifact@v4
        with:
          name: LargeFolder-windows-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
